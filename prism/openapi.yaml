openapi: 3.0.3
info:
  title: Library API
  version: "1.0"
  description: Library API with books and auth

servers:
  - url: http://localhost:4010

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegister"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
              example:
                access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwidHlwZSI6ImFjY2VzcyJ9.abc123"
                refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwidHlwZSI6InJlZnJlc2gifQ.xyz789"
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Username already exists"

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
              example:
                access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwidHlwZSI6ImFjY2VzcyJ9.abc123"
                refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwidHlwZSI6InJlZnJlc2gifQ.xyz789"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Invalid credentials"

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Refresh"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
              example:
                access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwidHlwZSI6ImFjY2VzcyJ9.new123"
                refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwidHlwZSI6InJlZnJlc2gifQ.new789"
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Invalid or expired refresh token"

  /books/:
    get:
      tags:
        - Books
      summary: Get books with pagination
      security:
        - Bearer: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: status
          in: query
          schema:
            type: string
            enum: [available, borrowed]
        - name: author
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of books
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBooks"
              example:
                items:
                  - id: "a4366f26-6e79-4eb8-82a8-ca5f2c87c98f"
                    title: "The Great Gatsby"
                    author: "F. Scott Fitzgerald"
                    description: "A novel about the American Dream"
                    status: "available"
                    year: 1925
                  - id: "b5477f37-7f8a-5fc9-93b9-db6g3d98d0ag"
                    title: "1984"
                    author: "George Orwell"
                    description: "A dystopian novel"
                    status: "borrowed"
                    year: 1949
                total: 2
                limit: 10
                offset: 0
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Missing or invalid token"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"
              example:
                message: "Rate limit exceeded"
                limit: 10
                window: "60s"

    post:
      tags:
        - Books
      summary: Create a new book
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreate"
      responses:
        "201":
          description: Book created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
              example:
                id: "c6588g48-8g9b-6gd0-a4c0-ec7h4ea9e1bh"
                title: "New Book"
                author: "New Author"
                description: "A new book description"
                status: "available"
                year: 2024
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Validation error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Missing or invalid token"

  /books/{book_id}:
    get:
      tags:
        - Books
      summary: Get a book by ID
      security:
        - Bearer: []
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Book found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
              example:
                id: "a4366f26-6e79-4eb8-82a8-ca5f2c87c98f"
                title: "The Great Gatsby"
                author: "F. Scott Fitzgerald"
                description: "A novel about the American Dream"
                status: "available"
                year: 1925
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Missing or invalid token"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Book not found"

    delete:
      tags:
        - Books
      summary: Delete a book
      security:
        - Bearer: []
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Book deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Missing or invalid token"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Book not found"

components:
  securityDefinitions:
    Bearer:
      type: apiKey
      name: Authorization
      in: header

  schemas:
    UserRegister:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 6

    UserLogin:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    Refresh:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    Token:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    BookCreate:
      type: object
      required: [title, author, description, status, year]
      properties:
        title:
          type: string
          minLength: 1
        author:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [available, borrowed]
        year:
          type: integer

    BookResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [available, borrowed]
        year:
          type: integer

    PaginatedBooks:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BookResponse"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Error:
      type: object
      properties:
        message:
          type: string

    RateLimitError:
      type: object
      properties:
        message:
          type: string
        limit:
          type: integer
        window:
          type: string